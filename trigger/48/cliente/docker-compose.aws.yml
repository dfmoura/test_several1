services:
  caddy:
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLIENTE_HOST: ${CLIENTE_HOST:-cliente.triggerti.com}
    volumes:
      - ./docker/caddy/Caddyfile.aws:/etc/caddy/Caddyfile:ro
      - ./apps/api:/var/www/html:ro
      - caddydata:/data
      - caddyconfig:/config
  app:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      MIGRATE_ON_BOOT: "false"
      PIX_DRIVER: inter
  worker:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      MIGRATE_ON_BOOT: "false"
      PIX_DRIVER: inter

volumes:
  caddydata:
  caddyconfig:
