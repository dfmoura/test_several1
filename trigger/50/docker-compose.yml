services:
  app:
    build: .
    # Container sempre escuta 8096. Host: APP_HOST_PORT (padrão 8097 neste workspace).
    expose:
      - "8096"
    # Acesso direto (dev). Em produção com HTTPS, deixe vazio:
    #   APP_HOST_PORT= docker compose --profile https up -d
    ports:
      - "${APP_HOST_PORT:-8097}:8096"
    volumes:
      - ./data:/app/data
      # Código vivo — evita rebuild só para ajuste de frontend/API
      - ./app:/app/app
      # Catálogo oficial de filiais (import idempotente)
      - ./unidades-osb.txt:/app/unidades-osb.txt:ro
    environment:
      # Interno do container (não confundir com APP_PORT do .env / run.sh)
      - APP_PORT=8096
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-0}
      - AUTH_SESSION_IDLE_MINUTOS=${AUTH_SESSION_IDLE_MINUTOS:-30}
      - AUTH_SESSION_DIAS=${AUTH_SESSION_DIAS:-7}
      - AUTH_BOOTSTRAP_USERNAME=${AUTH_BOOTSTRAP_USERNAME:-}
      - AUTH_BOOTSTRAP_PASSWORD=${AUTH_BOOTSTRAP_PASSWORD:-}
      - COLETA_SCHEDULER=${COLETA_SCHEDULER:-0}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - CNPJ_PUBLICO_POS_COLETA_LIMIT=${CNPJ_PUBLICO_POS_COLETA_LIMIT:-300}
      - CNPJ_PUBLICO_POS_COLETA_MAX_SEC=${CNPJ_PUBLICO_POS_COLETA_MAX_SEC:-900}
      - CNPJ_PUBLICO_POS_COLETA_ATE_HORA=${CNPJ_PUBLICO_POS_COLETA_ATE_HORA:-06:00}
      - CNPJ_PUBLICO_POS_COLETA_DESCANSO_SEC=${CNPJ_PUBLICO_POS_COLETA_DESCANSO_SEC:-60}
      - CARTO_BASEMAP_API_KEY=${CARTO_BASEMAP_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 25s

  # HTTPS (Let's Encrypt) — use: docker compose --profile https up -d --build
  # Pré-requisitos: DNS do DOMAIN → IP da VM; firewall com 80 e 443.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-observatorio.exemplo.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
