<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Observatório Social Brasil — PNCP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=osb5">
</head>
<body class="auth-locked">
  <a class="pula" href="#conteudo">Ir para o conteúdo</a>
  <div id="auth-gate" class="auth-gate">
    <div class="auth-card">
      <div class="auth-brand">
        <p class="brand-eyebrow">Observatório Social Brasil</p>
        <h1 class="brand-title">PNCP</h1>
        <p class="brand-sub">Contratações públicas, por filial</p>
      </div>
      <p class="auth-lead">Sem sessão, nenhum dado é exibido.</p>
      <p id="auth-msg" class="erro" hidden></p>
      <form id="form-login" class="form-col">
        <label>Usuário <input name="usuario" autocomplete="username" required></label>
        <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
        <button type="submit">Entrar</button>
      </form>
      <div id="auth-takeover" class="auth-takeover" hidden>
        <p id="auth-takeover-lead"></p>
        <button type="button" id="encerrar">Encerrar sessão anterior e entrar</button>
      </div>
    </div>
  </div>
  <div id="app-shell" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <p class="brand-eyebrow">Observatório Social Brasil</p>
        <p class="brand-title">PNCP</p>
        <p class="brand-sub">Contratações públicas</p>
      </div>
      <nav id="nav" class="nav" aria-label="Seções"></nav>
      <div class="sidebar-foot">
        <p id="quem" class="brand-sub"></p>
        <button type="button" id="sair" class="nav-btn">Sair</button>
      </div>
    </aside>
    <div class="content">
      <header class="topbar">
        <div>
          <h1 id="titulo" class="topbar-title">PNCP</h1>
          <p id="contexto" class="topbar-sub"></p>
        </div>
      </header>
      <main id="conteudo"></main>
    </div>
  </div>
  <script src="/static/app.js?v=osb5"></script>
</body>
</html>
