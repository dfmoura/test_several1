server {
    listen 80;
    server_name _;
    client_max_body_size 24m;
    root /var/www/web;
    index index.html;

    # SPA
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Docker DNS: sem isto o nginx guarda o IP antigo do `app` após restart → 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API Laravel (HTTP proxy — enxuto Lightsail ≤10 users)
    location /api/ {
        set $erp_app app;
        proxy_pass http://$erp_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header asaas-access-token $http_asaas_access_token;
        proxy_pass_header Authorization;
        proxy_read_timeout 120s;
    }

    location /sanctum/ {
        set $erp_app app;
        proxy_pass http://$erp_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /up {
        set $erp_app app;
        proxy_pass http://$erp_app:8000;
        proxy_set_header Host $host;
    }

    location /branding/ {
        alias /var/www/branding/;
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # index.html sem cache — senão o browser fica no JS antigo (0,0 km falso).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
